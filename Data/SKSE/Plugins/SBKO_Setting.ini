; =====================================================================================================================
;  SBKO_Setting.ini - SimpleBleedoutKO's everyday options
; =====================================================================================================================
;  Change a value, save, then start the game: the file is read once when the game loads.
;  1 = on, 0 = off. A line you delete keeps its default.
;  This file is read AFTER SimpleBleedoutKO.ini, and its values win. The advanced options (the knock-out roll formula,
;  skin-mark slots, logging, ...) stay in SimpleBleedoutKO.ini.
;  SimpleBleedoutKO.log (Documents/My Games/<your game>/SKSE/) lists every value in effect and the file it came from.
; =====================================================================================================================

[WhoGetsKnockedOut]
; Who SimpleBleedoutKO knocks out when they DROP in a fight (instead of the game's kneeling bleedout).
; Switched off = that group gets the game's own bleedout again. Someone already knocked out is never affected.
; The [Healing] settings below still apply to a switched-off group: with a slow regen and the instant heal blocked, an
; essential NPC kneeling in the game's bleedout can take a while to get up.
; (Your own deliberate knock-outs - a bash, a mace, the Sleep spell - have their own switches further down.)

; Your followers.
bKnockOutFollowers = 1
; Other protected and essential NPCs (quest characters and the like).
bKnockOutProtected = 1
; Ordinary NPCs (not protected, not essential). They get a knock-out ROLL when a hit leaves them badly hurt; the chance comes
; from their armour, the level difference and the hit's damage. 0 = ordinary NPCs are never knocked out (they bleed out and
; can die, as in the base game).
bKnockOutNormalNPCs = 1
; How much Health an ordinary NPC may have left (percent of her maximum) for a hit to roll for a knock-out. 15 = at 15 % or less.
fNormalNPCKnockOutHealthPercent = 15

[Healing]
; Health that protected and essential NPCs (followers included) regain per second out of combat. The game's own value is 5.0.
; 0.1 = slow; 0.01 = almost nothing (only potions and healing magic really help). -1 = leave the game's value alone.
fRegenRate = 0.1
; When a fight ends, the game instantly heals protected and essential NPCs back to full Health. Block it?
;   2 = blocked for every protected / essential NPC - they stay hurt
;   1 = blocked for followers only
;   0 = not blocked (the game's instant heal)
iBlockCombatEndHeal = 2

[Waking]
; A healing spell or a potion given to a knocked-out NPC wakes her up.
bHealWakes = 1
; The Health (percent of maximum) she has at least when she wakes.
fWakeHealthPercent = 25
; Without a heal she wakes on her own after a random time between these two values (in-game hours).
fWakeAfterHoursMin = 6
fWakeAfterHoursMax = 12
; The two short on-screen messages (knocked out / waking up).
bNotifications = 1

[YourHits]
; Knocking someone out with YOUR hit (the player only). No roll: it works when the rules below say so.
bHitKnockOut = 1
; A bash (shield, weapon, bow, torch) counts, anywhere on the body.
bBashKnockOut = 1
; A mace or warhammer counts. In Skyrim VR with PLANCK: on the head only; otherwise anywhere.
bBluntKnockOut = 1
; ...when it is a sneak attack, or she does not see you.
bSneakKnockOut = 1
; ...or when her Health is this low (percent of maximum).
bLowHealthKnockOut = 1
fLowHealthKnockOutPercent = 10
; A worn helmet (light or heavy armour on the head) makes her immune.
bHelmetProtects = 1
; Wig / hair mods whose wigs are made as armour count as helmets by mistake - list their plugin files here (comma-separated).
sHelmetIgnorePlugins = KSWigsSMP.esp, Xing SMP Hairs and Wigs - Dint999.esp, [ELLE] Roca.esp, [ELLE] Warrior.esp, [ELLE] Knight Elaine.esp, [ELLE] SK Shinobi.esp, DreadGirl.esp, Skyrim On Skooma.esp
; Your hits can knock out your own followers too.
bHitKnockOutFollowers = 1

[SleepSpell]
; The Sleep spell (Illusion, sold by Drevis Neloren): a hit puts the NPC to sleep, 100 %.
bSleepSpell = 1
; It works on your followers too.
bSleepSpellFollowers = 1
; Any hit wakes a sleeper.
bSleepWakeOnHit = 1
; Talking to a sleeper wakes her.
bSleepWakeOnTalk = 1

[Extras]
; Skin marks that follow Injury Engine's wounds (needs Injury Engine, RaceMenu and Battle Wounds).
bSkinMarks = 1
; The player gets the marks too.
bSkinMarksOnPlayer = 1
; With SkyrimNet: an NPC you wake up to talk to knows you woke her.
bWokenToTalk = 1
; While SNEAKING, activating a knocked-out NPC (pick "Activate" if Diary of Mine shows its box) opens her inventory: take her
; things freely - it never counts as stealing, seen or not. Standing up, the click works as before (Diary of Mine, talking).
; With MageVR Reborn's VR Backpack (pickpocket on in its MCM), its pickpocket panel takes this over: always succeeds, no alarm,
; but the items you take are marked stolen.
bLootKnockedOut = 1

; SimpleBleedoutKO.ini - SimpleBleedoutKO 2.1.0 advanced settings.
; Read once when the game's data loads: restart the game after an edit. A missing key (or a missing file) = its default.
; 2.1.0: the everyday options are in SBKO_Setting.ini (next to this file), read AFTER this file - its values win. Their old lines
; below are commented out (";key=..."); to set one here instead, remove its ";" AND delete the same option from SBKO_Setting.ini.
; "She" / "her" below means any NPC.
; What each section needs (everything else is built in):
;   [Knockout] [Unconscious] [Regen] [HealWake] [HeadHit] [ChanceKO] [Sleep] [Woken] - nothing extra (SkyrimNet adds the AI lines,
;   PLANCK adds the head-only rule in VR, Diary of Mine / SeverActions / Smart NPC Potions are handled when installed).
;   [Marks] - RaceMenu (RaceMenu VR in VR), Battle Wounds (the "Collygon - Wounds" textures, loose files) and Injury Engine.
;   [FDC] - an optional Follower Death and Injury Chance patch that is NOT part of this mod: without it the section does nothing.
;   [TakeOver] - a VRTouchEvents version that hands its choke knock-out to SimpleBleedoutKO (not released yet).
; The log is Documents/My Games/<game>/SKSE/SimpleBleedoutKO.log (the previous session's log is kept as SimpleBleedoutKO.log0).

[Knockout]
; Her Health when she wakes up (a heal, the timer, or the load safety): raised to AT LEAST this fraction of her maximum, never
; lowered - a big heal that already put her higher stays. 0.25 = she wakes at a quarter, still hurt.
;fWakeHealthFraction=0.25   ; 2.1.0: set in SBKO_Setting.ini (fWakeHealthPercent) - its value wins

; Seconds an NPC stays in the game's own bleedout before SimpleBleedoutKO knocks her out. Other mods that act on bleedout get their
; turn first (Follower Death and Injury Chance's roll, SeverActions, Diary of Mine's bleedout menu). If she dies, gets up or is taken
; in that time, nothing happens. 0 = knock out at once. If you use Follower Death and Injury Chance WITHOUT a patch for this mod,
; 1.5 gives its roll the time to happen.
fBleedoutGraceSeconds=0

; The first N checks after a knockout are the settle: Health jumps when the engine lets go of the bleedout, so nothing is
; judged yet. After it, an unconscious NPC's Health is held (see fUnconsciousHealthFraction).
iGraceChecks=2

; Wake after a random number of GAME hours between these two (if no heal woke her first).
;fRecoverMinHours=6.0   ; 2.1.0: set in SBKO_Setting.ini (fWakeAfterHoursMin) - its value wins
;fRecoverMaxHours=12.0   ; 2.1.0: set in SBKO_Setting.ini (fWakeAfterHoursMax) - its value wins

; How often (real seconds) the NPCs this mod is handling are checked.
fCheckSeconds=1.5

; Seconds of play spent on each coming-to stage (3 -> 2 -> 1 -> 0; menus pause it).
fStageSeconds=60.0

; On-screen lines: "<name> is knocked out.", the wake lines ("<name> regains consciousness...") and "<name> is too injured to
; wake up." when another mod tries to wake her (1 = on).
;bNotify=1   ; 2.1.0: set in SBKO_Setting.ini (bNotifications) - its value wins

[Unconscious]
; A protected or essential NPC who drops to 0 Health is knocked out UNCONSCIOUS (ragdolled, Paralysis, no natural regen)
; instead of kneeling in bleedout. She wakes ONLY on a real heal (see [HealWake]) or when the timer runs out.
; If another mod tries to wake her (for example Diary of Mine's "Wake"), she is put back down with
; "<name> is too injured to wake up." - she needs healing. If another mod TAKES her (Diary of Mine's Bag, Abduct or Tie-up,
; VRTouchEvents' choke), this mod lets her go and that mod does its thing.
; After the settle her Health is held at this fraction of her maximum, or lower if she was lower then; when she takes damage the
; hold follows her down. Any rise without a heal is put back. This mod never heals her. 0.25 = a quarter.
fUnconsciousHealthFraction=0.25

; A knocked-out NPC that SeverActions tracks (its followers) is excluded from SeverActions' survival while she is out (so it does
; not feed her or play its eating idle on her), and included again with her hunger / fatigue / cold restored when she wakes.
; Only when SeverActions is installed and its survival is on. A follower you excluded yourself is never touched. (1 = on, 0 = off)
bSeverActionsGuard=1

; Smart NPC Potions' drink-potion abilities are taken off a knocked-out NPC and given back when she wakes, so she cannot drink
; a potion while unconscious. Only when Smart NPC Potions is installed. (1 = on, 0 = off)
bPotionsOff=1

; If a knocked-out NPC's animation starts walking while her body lies on the ground (another mod forced an idle on her),
; she is shoved back into the ragdoll, once per check that saw it. Needs bLogFootsteps=1 in [Log]. (1 = on, 0 = off)
bRepairWalkingGraph=1

[Regen]
; GAME-WIDE: the game's own out-of-combat health regen for ESSENTIAL / protected NPCs (the game setting
; fEssentialNonCombatHealRateBonus; the game's default is 5.0 - about 5 HP per second, which refills a follower in a minute).
; It applies to every essential or protected NPC, not only knocked-out ones. Written at every game start and load.
; 0.1 = slow: a follower takes a long while to heal on her own after a fight. 0.01 = almost nothing: no healing without a potion or
; magic. -1 = this mod leaves the game's value alone.
; Console check: getgs fEssentialNonCombatHealRateBonus
;fEssentialNonCombatHealRateBonus=0.1   ; 2.1.0: set in SBKO_Setting.ini (fRegenRate) - its value wins

; GAME-WIDE: the Health an UNCONSCIOUS (or tied-up) essential or protected NPC is set to when a killing blow lands on her (the game
; setting fEssentialHealthPercentReGain; the game's default is 0.3 = 30 % of her maximum - a knocked-out NPC below 0 HP who was hit
; again jumped to 30 %). Written at every game start and load. 0.01 = 1 %, the same as this mod's own lowest hold. -1 = leave it alone.
; Console check: getgs fEssentialHealthPercentReGain
fEssentialHealthPercentReGain=0.01

; SKYRIM VR 1.4.15 ONLY. The game's FULL heal when a fight ends: the engine puts every essential or protected NPC back to full Health
; the moment her combat stops (that is why followers jump to full right after a fight). It is skipped for: 2 = every essential or
; protected NPC (they stay hurt and heal slowly), 1 = followers only (your teammates), 0 = nobody (the game's own behaviour). In every
; mode it is also skipped for the NPCs this mod knocks out and wakes, so she is held at her real Health and wakes at
; fWakeHealthFraction, not full. On Skyrim SE / AE this setting does nothing (the log says so at the start).
;iCombatEndRefill=2   ; 2.1.0: set in SBKO_Setting.ini (iBlockCombatEndHeal) - its value wins

[HealWake]
; A real heal (a healing spell, a staff or scroll, a potion given to her) wakes an unconscious NPC straight up: she gets up and
; is "coming to". (1 = on, 0 = off - then only the timer wakes her)
;bHealWake=1   ; 2.1.0: set in SBKO_Setting.ini (bHealWakes) - its value wins

[HeadHit]
; YOUR bash or blunt-weapon hit can knock an NPC out (no punches; a mace or warhammer to the head when PLANCK is installed,
; anywhere without it).
; She goes down unconscious (ragdoll, no regen) and wakes by this mod's rules: a real heal, or the 6-12 game-hour timer. Her Health
; is held where it was when you knocked her out (a sneak bash at full Health keeps her at full - no 25 % pull-down).
; Punches (bare hands) NEVER knock anyone out - they get in the way of Injury Engine and Diary of Mine.
; Only the player's hits count. Never a ghost, never someone already down, bleeding out or taken by another mod, never during a brawl
; or the Companions' fist-fight. There is no random chance: when the rules below are met, she is out.
; Master switch (1 = on, 0 = off - your hits never knock anyone out).
;bHeadHit=1   ; 2.1.0: set in SBKO_Setting.ini (bHitKnockOut) - its value wins

; A bash counts, wherever it lands: shield, weapon pommel, bow, torch. (1 = on, 0 = off)
;bHeadHitBash=1   ; 2.1.0: set in SBKO_Setting.ini (bBashKnockOut) - its value wins

; A mace or a warhammer counts too. WITH PLANCK installed (Skyrim VR): ONLY on the head - PLANCK's own reading of the bone you hit
; ("NPC Head [Head]"; the neck does not count; a hit PLANCK did not make does not count). WITHOUT PLANCK (Skyrim SE / AE always, or VR
; without PLANCK): ANYWHERE it lands. The log line says which rule was used. (1 = on, 0 = off)
;bHeadHitBlunt=1   ; 2.1.0: set in SBKO_Setting.ini (bBluntKnockOut) - its value wins

; It knocks her out when it is a SNEAK ATTACK, or when she does NOT DETECT you (the same test as the game's IsDetectedBy).
; (1 = on, 0 = off)
;bHeadHitSneak=1   ; 2.1.0: set in SBKO_Setting.ini (bSneakKnockOut) - its value wins

; It knocks her out when her Health is at or under fHeadHitHealthThreshold (after your hit). (1 = on, 0 = off)
;bHeadHitLowHealth=1   ; 2.1.0: set in SBKO_Setting.ini (bLowHealthKnockOut) - its value wins

; That Health line, as a fraction of her maximum. 0.10 = 10 %.
;fHeadHitHealthThreshold=0.10   ; 2.1.0: set in SBKO_Setting.ini (fLowHealthKnockOutPercent) - its value wins

; A helmet makes her immune. A HELMET = something she WEARS on the head or hair (body slot 30 or 31) that is LIGHT or HEAVY armour.
; Clothing never counts: hoods, circlets, cloth caps, cloth wigs. Anything not worn on the head or hair never counts either - a cape
; or a cloak is not a helmet, even when its mod tags it as one. Devious Devices items are not armour. The "[headhit]" line names the
; helmet, or each head / hair item that did not count and why. A wig that its mod made LIGHT armour would count as a helmet - unless
; its mod is in the list below.
; (1 = on, 0 = off - helmets do nothing)
;bHeadHitHelmetProtects=1   ; 2.1.0: set in SBKO_Setting.ini (bHelmetProtects) - its value wins

; Wig and hair mods: anything WORN that comes from one of these plugins is NEVER a helmet (here and in [ChanceKO]), even when that
; mod made its wigs light armour. Plugin file names, separated by commas; upper / lower case does not matter. It goes by the plugin
; that ADDS the item (a patch that only changes it later does not matter). A plugin you do not have is simply skipped. Leave it empty
; (sHelmetIgnorePlugins=) to ignore none. Add your own wig mods here. The "[headhit]" / "[chanceko]" line then says "a listed hair /
; wig plugin"; at game start the log lists them and names any that is not loaded.
; Default = KS Wigs SMP, Xing / Dint999 SMP wigs, and outfit / follower mods whose only "helmet" is a hair piece.
;sHelmetIgnorePlugins=KSWigsSMP.esp, Xing SMP Hairs and Wigs - Dint999.esp, [ELLE] Roca.esp, [ELLE] Warrior.esp, [ELLE] Knight Elaine.esp, [ELLE] SK Shinobi.esp, DreadGirl.esp, Skyrim On Skooma.esp   ; 2.1.0: set in SBKO_Setting.ini (sHelmetIgnorePlugins) - its value wins

; Your followers can be knocked out by your hits too. (1 = on, 0 = off - followers are never knocked out by you)
;bHeadHitFollowers=1   ; 2.1.0: set in SBKO_Setting.ini (bHitKnockOutFollowers) - its value wins

; One "[headhit]" line in the log for each bash or mace / warhammer hit you land on someone: the weapon, PLANCK's hit bone, head
; yes / no, which blunt rule was used (head only / anywhere), the sneak-attack bit, her detection value, helmet, her Health, and the
; result with its reason. Punches make no line. The knock-out itself is always logged. (1 = on, 0 = off)
bLogHeadHits=1

[ChanceKO]
; A hit that leaves an ordinary NPC (NOT essential, NOT protected - bandits, soldiers, mages, hunters, townsfolk) at or under
; fChanceKOHealthBelow of her Health, but still alive, gets a KNOCK-OUT ROLL. It does not matter who landed the hit: you, a follower or
; another NPC. Won: she is knocked out (unconscious, ragdoll, held at her Health then, no 25 % pull-down, wakes by a heal or the
; 6-12 game-hour timer). Lost: nothing happens - the game decides (she may kneel in bleedout for 5-15 seconds, "acting hurt", or keep
; fighting; melee bandits never kneel). A hit that takes her to 0 or below kills her, as always, and a knocked-out NPC still dies from
; any damage that takes her to 0.
; Every hit rolls on its own (a weapon swing, an arrow or bolt, a bash, a creature's claw or bite, a spell's impact, and a spell held on
; her - Flames, Frostbite, Sparks - rolls once per cast). These never roll: punches (bare hands), damage over time (burning, poison,
; frost that lingers), cloaks, hazards, a weapon's enchantment or poison on its own (it rides on the weapon hit), falls, traps, scripts.
; Ordinary NPCs are not knocked out just for kneeling in bleedout: the roll of the hit that put her there decides. If no rolled
; hit put her there (a burn, a fall ...), she rolls once when she kneels. A punch that puts her there: no roll, she acts hurt.
; Essential and protected NPCs (followers, quest people) are knocked out when they drop, whatever this says.
; Creatures are never knocked out.
; Master switch (1 = on, 0 = off - no roll anywhere, and every NPC who kneels in bleedout is knocked out).
bChanceKO=1

; The Health line, as a fraction of her maximum, after the hit. 0.15 = 15 %.
;fChanceKOHealthBelow=0.15   ; 2.1.0: set in SBKO_Setting.ini (fNormalNPCKnockOutHealthPercent) - its value wins

; A creature's own attack (a wolf's bite, a troll's claws - the game calls it "unarmed") rolls like a weapon. A person's bare hands
; (yours too) never roll. (1 = on, 0 = off - creature attacks never roll)
bChanceKOCreatureHits=1

; One "[chanceko]" line in the log for each hit that reaches the roll: who hit whom with what, her Health, every part of the chance
; (helmet, boots, gloves, body, level, damage), the chance, the roll and the result - or why there was no roll. Also one line when an
; ordinary NPC kneels in bleedout (acting hurt, or her roll there). A knock-out is always logged. (1 = on, 0 = off)
bLogChanceKO=1

; THE CHANCE = helmet + boots + gloves + body + level + damage, kept between 0 and 100 %. Mages and archers in cloth go down far more
; often than a fighter in full plate. Example: no helmet (20), heavy boots (0), heavy gloves (0), heavy armour (0), 10 levels under the
; one who hit her (+10), a hit of half her maximum Health (+5) = 35 %.
; Only what she WEARS counts. Cloth shoes and cloth gloves count as none. Clothes, a robe or nothing on the body = "clothes".
; Devious Devices items are not armour (skipped). A helmet = the same as in [HeadHit]: worn on the head or hair (slot 30 or 31) AND
; light or heavy armour; hoods, circlets, cloth wigs and capes are not helmets; nor is anything from a plugin in [HeadHit]
; sHelmetIgnorePlugins (the wig mods).
; Helmet worn / no helmet:
fChanceKOHelmetOn=0
fChanceKOHelmetOff=20
; Boots heavy / light / none:
fChanceKOFeetHeavy=0
fChanceKOFeetLight=5
fChanceKOFeetNone=10
; Gloves heavy / light / none:
fChanceKOHandsHeavy=0
fChanceKOHandsLight=5
fChanceKOHandsNone=10
; Body heavy / light / clothes or nothing:
fChanceKOBodyHeavy=0
fChanceKOBodyLight=10
fChanceKOBodyClothes=20
; Level: this many points for each level the one who hit her is ABOVE her (minus when he is below), never more than fChanceKOLevelMax
; either way.
fChanceKOPointsPerLevel=1
fChanceKOLevelMax=20
; Damage: a hit as big as her whole maximum Health adds this much; smaller hits add their share (a hit of half her Health = half).
fChanceKODamageMax=10

[Sleep]
; The SLEEP spell (Illusion, Apprentice; its tome and its scroll are sold by Drevis Neloren at the College of Winterhold when SkyPatcher
; is installed - without SkyPatcher: console "help sleep" to find the tome, then "player.additem <id> 1"). Touch a person and cast
; it: she falls into a deep, magical sleep (unconscious, ragdoll, held at her Health then, no 25 % pull-down, no Follower Death Chance
; roll), and she wakes by a real heal or the 6-12 game-hour timer, like any knock-out - or the ways below.
; It always works on a valid target: no roll, no "does she see you" rule, no Health rule, no helmet test. Valid = a person (not a
; creature, not a ghost), alive, not already down, not in a brawl, not held by another mod (Diary of Mine, VRTouchEvents ...). Only
; YOUR cast counts. Not a crime. Whether she SAW you when it landed only changes what she remembers when she wakes (SkyrimNet): seen =
; the last thing she remembers is your hand on her and a magical glow around your finger, and she is unsure whether it was a dream;
; not seen = she simply wakes up confused.
; 1 = the Sleep spell works, 0 = it does nothing.
;bSleep=1   ; 2.1.0: set in SBKO_Setting.ini (bSleepSpell) - its value wins
; Followers can be put to sleep too (1), or never (0).
;bSleepFollowers=1   ; 2.1.0: set in SBKO_Setting.ini (bSleepSpellFollowers) - its value wins
; One log line per Sleep cast that lands on someone: who, seen or not (her detection value), Health, the result with its reason.
; The knock-out itself is always logged. (1 = on, 0 = off)
bLogSleep=1
; It is only sleep: ANY hit wakes her up at once - from anyone (you, a follower, an enemy), with anything (a weapon, a bash, an arrow,
; a spell, bare hands), even a hit that does no damage. She gets up as after a heal (her Health is not lowered; she is raised to the
; wake Health only if she is below it). The Sleep spell itself never wakes her. A "[sleep] ... woken by a hit from ..." line is logged.
; Only people put down by the Sleep spell: anyone knocked out by an injury still needs a heal. (1 = on, 0 = off)
;bSleepWakeOnHit=1   ; 2.1.0: set in SBKO_Setting.ini (bSleepWakeOnHit) - its value wins
; It is only sleep: TALKING to her (activating her) wakes her up the same way. Only people put down by the Sleep spell.
; DIARY OF MINE USERS: set this to 0 - otherwise talking wakes her before you can pick Tie-up or Bag in Diary of Mine's menu; its
; "Wake" choice still wakes a sleeper. (1 = on, 0 = off)
;bSleepWakeOnTalk=1   ; 2.1.0: set in SBKO_Setting.ini (bSleepWakeOnTalk) - its value wins

[FDC]
; NEEDS A PATCH THAT IS NOT PART OF THIS MOD (a Follower Death and Injury Chance patch that listens for this mod's "SBKO_FdcHit"
; event). Without it this whole section does nothing (the log says "OFF").
; With it: a follower kept unconscious after she went down from her wounds (a bleedout knock-out) gets ONE MORE Follower Death Chance
; roll for every direct hit she takes while you are in combat: a weapon, an arrow, a bash, a creature's attack, a spell's impact, one
; per concentration beam. Never a burning / poison tick, a cloak, a trap, a punch, a toy weapon, a 0-damage hit. A follower knocked out
; by a hit, the Sleep spell or a choke never gets the roll (her Health is above 0).
bFdcRerollOnHit=1

; 1 = your own hits re-roll too. 0 = only OTHER people's hits (enemies, other followers) re-roll - yours never.
bFdcRerollPlayerHits=0

; 1 = a re-roll that misses does nothing (only the death chance is rolled again). 0 = the full roll each time (a miss = the patch's
; small injury, each hit again).
bFdcRerollDeathOnly=1

; One log line for every hit on such a follower (re-roll asked, or why not) (1 = on).
bLogFdcReroll=1

[TakeOver]
; NEEDS A VRTouchEvents VERSION THAT SUPPORTS IT (not released yet; until then nothing calls it).
; VRTouchEvents' choke: when the choked NPC passes out, VRTouchEvents hands her to this mod and she is kept by its rules: held at her
; Health, no Follower Death Chance roll, she wakes only on a real heal or after the timer (fRecoverMinHours-fRecoverMaxHours game
; hours), Diary of Mine's Wake says she is too injured, SkyrimNet is told she was choked unconscious (she comes round confused and
; hoarse, with a vague memory of your hand around her throat). How long the choke was held is kept for the neck mark.
; 0 = say no: VRTouchEvents keeps its own knock-out.
bTakeOver=1

; One log line for every take-over call (accepted / declined and why / already held) and every choke release (1 = on).
bLogTakeOver=1

[Woken]
; When YOU wake a sleeping NPC - you talk to (activate) someone asleep in a bed, or you pick Diary of Mine's "Wake" on her - SkyrimNet
; is told "<you> has just woken <her> up to talk to <her>." and she answers you (groggy, surprised, annoyed - hers to play). A sleeper
; put down by the Sleep spell and woken by Diary of Mine's "Wake" is told you woke her from a deep sleep. Never while you sneak (a
; pickpocket), never an enemy. Needs SkyrimNet. 0 = off.
;bWokenNarration=1   ; 2.1.0: set in SBKO_Setting.ini (bWokenToTalk) - its value wins

; The talk: you activate an NPC asleep in a bed (1 = on).
bWokenOnTalk=1

; Diary of Mine's menu "Wake" (needs Diary of Mine) (1 = on).
bWokenOnDomWake=1

; How SkyrimNet is told about the TALK: 1 = she answers you right away. 0 = she only knows it (no reaction until you speak) - use 0 if
; her answer and the game's own wake-up greeting talk over each other.
iWokenTalkMode=1

; One log line for every wake you cause (pending / woken / not woken and why) (1 = on).
bLogWoken=1

; Diagnostics only: one [probe] line for every NPC you activate and for every perk menu choice. Leave it at 0 unless asked for a log.
bLogWokenProbe=0

[Marks]
; SKIN MARKS. Everyone Injury Engine wounds gets the matching Battle Wounds mark on the wounded part - a bruise, a cut, hand marks,
; a grip around the wrist - and it comes off when Injury Engine heals the wound. Burns, frost and lightning have no art yet (unmarked).
; Needs RaceMenu (RaceMenu VR in VR), Battle Wounds (the "Collygon - Wounds" textures, installed as LOOSE files) and Injury Engine.
; FACE marks need RaceMenu's face overlay count raised: in skee64.ini (SE / AE) or skeevr.ini (VR), [Overlays/Face] iNumOverlays=13
; or more (the stock value 3 has no slot 10-12). 0 = no marks at all.
;bMarks=1   ; 2.1.0: set in SBKO_Setting.ini (bSkinMarks) - its value wins

; You get Injury Engine's marks too (in VR you see them on your own arms and body) (1 = on).
;bMarkPlayer=1   ; 2.1.0: set in SBKO_Setting.ini (bSkinMarksOnPlayer) - its value wins

; Khajiit / Argonian: 0 = no face marks, no choke mark and no wrist / ankle bands (the face art and the bands are drawn for human
; heads, hands and feet; their body marks stay). 1 = those too.
bBeastFaceMarks=0

; The wrist / ankle bands for grip (pulling) and fall wounds (1 = on).
bWristAnkleBands=1

; The face's extra layers at medium / severe: a bruised eye, blood at the nose / lip, a blood splatter (1 = on; 0 = one face mark only).
bFaceLayers=1

; 1 = burns show as a near-black bruise (severe) and frostbite as a violet bruise (medium / severe) until real art exists. 0 = unmarked.
bStandIns=0

; The RaceMenu overlay slots this mod paints in (never a slot another mod holds - a full band = that mark is skipped, one log line).
; Face 10-12: the face mark and its layers. Body 3-5: one slot per wounded body part, the worst three. Hands 2 / Feet 2: the bands.
; Face 16: the choke hand mark (only when bChokeMark=1).
iFaceFirst=10
iFaceLast=12
iBodyFirst=3
iBodyLast=5
iHandsSlot=2
iFeetSlot=2
iChokeSlot=16

; How strong a mark is: Injury Engine's light, medium, severe.
sStageAlphas=0.50,0.75,1.00

; The faintest a mark is ever painted (under 30 % you could not see it).
fAlphaFloor=0.30

; One knob for every mark: 1.0 = as above; 0.8 = all softer; 1.2 = all stronger (never above 1.0, never under the floor).
fAlphaScale=1.0

; THE CHOKE HAND MARK: Battle Wounds' "Choked Two Hands" around the neck, by how long the choke was held (1 = on). Off by default:
; VRTouchEvents paints its own choke neck marks; this mod only takes over the knocked-out state. Needs face overlay slot 16
; (iNumOverlays=17 or more). 0 = no neck mark from this mod.
bChokeMark=0

; Seconds held: under the first number = 50 %, up to the second = 75 %, at or above it = 100 %.
sChokeSteps=20,30

; Its life: this many game hours per step (50 % = 12 h, 75 % = 24 h, 100 % = 36 h). It fades by thirds: full, then halfway to 30 %,
; then 30 % with the "Faded" version, then it is gone.
fChokeHoursPerStep=12.0

; Each healing spell or potion that reaches her takes this share of the time the mark has LEFT (0.5 = half). One cast = one heal.
fChokeHealShare=0.5

; A choke you let go BEFORE she passed out: 1 = a light mark (30 %) that lasts 12 game hours x seconds / 15 (a 10 s choke = 8 h).
; 0 = no mark - only a choke that knocked her out leaves one.
bChokeMarkBeforePassout=0

; VRTouchEvents' passout time: a choke released at or after this many seconds counts as one that knocked her out.
fChokePassoutSeconds=15.0

; The mark table (which mark for which wound), relative to Data/. You can edit it; a mistake is skipped with one log line.
sMarksFile=SKSE/Plugins/SimpleBleedoutKO/marks.json

; One log line per mark change (painted / faded / cleared / skipped / no art / choke) (1 = on).
bLogMarks=1

; Diagnostics: one "[PERF] marks:" line per minute of play (reads, writes, set-ups, how long the worst one took) (1 = on).
bPerfMarks=0

[Log]
; Whatever this section says, the log always gets every change (knocked out, woken, taken, adopted ...), every anomaly, and ONE
; "PERF" line per minute of play (how long the checks take - a report only).
; 1 = ALSO one line per check for every knocked-out NPC, and every Health put-back (for debugging; about 75 KB per minute with
; 5 NPCs down). 0 = off.
bVerboseChecks=0

; Log the magic effects (spells, potions, scrolls) that land on an NPC this mod holds: each kind once per knockout (abilities that a
; reload puts back on her are counted in one line, not listed) (1 = on). The heal wake works either way.
bLogEffects=1

; Count the footsteps of a knocked-out NPC's animation (a ragdolled body should send none) and log them (1 = on). Keep it on:
; bRepairWalkingGraph in [Unconscious] needs it.
bLogFootsteps=1
